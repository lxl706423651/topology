entry_strategy_description: 仅使用原库有限窗口白名单及有界多尺度环境，逐折内部选最多154列并拟合3/5日净收益；前5门控及每批总资产10%不变。
report_limitations: '- 历史数据已被此前研究查看；本轮是预先固定流程的历史稳健性检查，不是全新未见样本。

  - 原始行情无完整历史ST状态、退市总表、复权因子和公司行动。使用2026年名称快照排除ST/退，仍有前视筛选及幸存者偏差；原始价格的分红拆股也未完整记账。

  - 交易只在信号之后的下一分钟收盘模拟成交。使用双边万八佣金、免5、日期对应印花税、双边十万分之一过户费和双边万五滑点。

  - 每次成交额最多占下一分钟成交额5%，零量/缺失不成交；主板前收盘±9.5%是保守阻成交代理，不等于完整涨跌停、集合竞价及排队模型。停牌持仓用最后可见价格估值，无法反映退市损失。

  - 止损在24分钟采样点和日终检查，不是逐分钟监控；T+1或无法卖出时保存待平仓状态，不保证以止损价成交。入场后的首个监控区间保守只用当前收盘更新最高价，避免引入买入前的分钟内高点。

  - 各年从相同现金独立启动，年末持仓按市值保留，不虚构强制成交。跨年拼接只是独立年度收益的统计连接，不是连续持仓实盘仿真。

  - 方法二沿用方法一的XGBoost核心，仅增加CTA叠加，不能假定两者为独立收益来源。

  - 最终全量模型包含2026训练数据，必须用2026年4月之后未参与研究的新数据或模拟盘验收；不能引用年度模型成绩充当它的独立测试成绩。


  - 本轮算法已改为岭回归与技术信号保序校准，是独立研究对照，不能当作旧XGBoost/CTA模型复现或静默替换实盘。

  - 留一年回顾研究，部分折含未来年份训练/选参；2026仅1至4月，非实盘证明。

  - 核心拟合、校准、验证各为非留出年的60%/20%/20%交易日片段；每段起点隔离7自然日，标签不得跨段。留出年后另隔离60交易日，逐行审计真实来源包络；核心来源不得借用上年内部验证行情。

  - 固定26个输入，不进行收益择优的特征筛选。删除递推及累计因子；ATR为240条有效分钟真实波幅简单均值，另需一条前收。20/40倍分钟ATR不是20/40倍日ATR。

  - 核心拟合每股每天仅一个预定钟点，每H+1交易日取样，剔除同股重叠标签；跨股票及年度轮换仍相关，不是独立同分布实验。

  - 岭回归填补和标准化只拟合核心数据；保序模型仅在事前技术资格区域拟合10个等宽强度箱。模型不在内部验证后重训，避免门槛漂移。

  - 标签为H个交易日同刻下一分钟交易的扣费收益，截断至正负20%。预测不是扣容量/资金约束后的实际组合收益；ATR可提前退出，待卖出可能推迟，吊顶模式也可超过预测期限。

  - 当前ST/退市名称快照不是历史状态，前收和涨跌停为代理，复权/公司行动未完整处理；这些偏差及已反复研究历史仍存在。不能保证收益或据此直接实盘。

  - 每个内部片段现金重启，期末持仓按市值估值、不强行平仓。年度测试也各自现金重启，四年不是拼接的连续账户。

  - 外层晋级须至少一种方法四折全部内部启用。最终每方法完整四折等权平均夏普须严格大于3；空仓无波动年不能删掉，不能把内部夏普当外层成绩。

  '
