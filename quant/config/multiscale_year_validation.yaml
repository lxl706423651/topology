# 仅在训练内部研究多日收益与多尺度行情；新目录保留失败候选，不覆盖前轮。
base_config: config/learned_exit_year_validation.yaml
output_dir: reports/multiscale_year_validation
multiscale_cache_dir: reports/multiscale_year_validation/cache
signal_cache_dir: reports/inventory_t_cross_validation/cache
entry_horizons: [3, 5]
# 排除留出年之后60个实际交易日，防止多日特征读取留出年的价格。
feature_embargo_trading_days: 60
minimum_signal_amount: 200000.0
model_profiles:
  - {name: horizon3_shallow, horizon: 3, max_depth: 3, n_estimators: 240, min_child_weight: 80, reg_lambda: 12.0}
  - {name: horizon3_deeper, horizon: 3, max_depth: 5, n_estimators: 300, min_child_weight: 80, reg_lambda: 16.0}
  - {name: horizon5_shallow, horizon: 5, max_depth: 3, n_estimators: 240, min_child_weight: 80, reg_lambda: 12.0}
  - {name: horizon5_deeper, horizon: 5, max_depth: 5, n_estimators: 300, min_child_weight: 80, reg_lambda: 16.0}
gate_quantiles: [0.50, 0.80, 0.90]
train_shortlist: 3
exit_candidates:
  - {name: next_day_control, initial: 30.0, trailing: 60.0, max_days: 1, exit_threshold: -1000000000.0}
  - {name: continuation0_atr20_40, initial: 20.0, trailing: 40.0, max_days: 20, exit_threshold: 0.0}
  - {name: continuation_negative_atr20_40, initial: 20.0, trailing: 40.0, max_days: 20, exit_threshold: -0.001}
  - {name: continuation0_atr30_60, initial: 30.0, trailing: 60.0, max_days: 20, exit_threshold: 0.0}
